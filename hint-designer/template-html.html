<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GVE Hint Designer</title>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>GVE Hint Designer</h1>
      <p class="subtitle">Design and animate hints for the GVE Snapshot Rendition component</p>
    </header>

    <div class="main-content">
      <!-- Canvas Area -->
      <div class="canvas-area">
        <div class="canvas-header">
          <h2>Canvas</h2>
          <div class="canvas-info">
            <span id="canvas-dimensions">200 × 40 px</span>
            <span class="separator">|</span>
            <span id="grid-info">Grid: 10px</span>
          </div>
        </div>
        <div class="canvas-wrapper">
          <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
            <!-- Grid background (will be generated by JS) -->
            <g id="grid-layer"></g>
            <!-- Hint rendering area -->
            <g id="hint-layer"></g>
          </svg>
        </div>
      </div>

      <!-- Controls Area -->
      <div class="controls-area">
        <div class="controls-section">
          <h2>Hint Selection</h2>

          <!-- Dropdown selector -->
          <div class="control-group">
            <label for="hint-select">Select Hint:</label>
            <select id="hint-select">
              <option value="">-- Choose a hint --</option>
            </select>
          </div>

          <!-- Navigation buttons -->
          <div class="control-group button-row">
            <button id="btn-prev" class="btn btn-secondary" title="Previous hint">
              <span>←</span> Previous
            </button>
            <button id="btn-next" class="btn btn-secondary" title="Next hint">
              Next <span>→</span>
            </button>
          </div>

          <!-- Thumbnails -->
          <div class="control-group">
            <label>Quick Select:</label>
            <div id="thumbnails-container" class="thumbnails"></div>
          </div>
        </div>

        <div class="controls-section">
          <h2>Hint Properties</h2>
          <div id="hint-properties" class="properties-display">
            <p class="empty-state">Select a hint to view its properties</p>
          </div>
        </div>

        <div class="controls-section">
          <h2>Actions</h2>
          <div class="control-group button-row">
            <button id="btn-copy" class="btn btn-primary" title="Copy hints and animations to clipboard">
              📋 Copy JSON
            </button>
            <button id="btn-import" class="btn btn-primary" title="Import hints and animations from clipboard">
              📥 Import JSON
            </button>
          </div>
          <div class="control-group button-row">
            <button id="btn-reset-animation" class="btn btn-secondary" title="Reset and replay animation">
              🔄 Reset Animation
            </button>
            <button id="btn-toggle-handle" class="btn btn-secondary" title="Toggle handle visibility">
              🎯 Toggle Handle
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Animation Timeline Controls -->
    <div class="timeline-section">
      <h2>Animation Timeline</h2>
      <div id="gsap-tools"></div>
    </div>

    <!-- Status bar -->
    <div class="status-bar">
      <span id="status-message">Ready</span>
    </div>
  </div>
</body>
</html>
